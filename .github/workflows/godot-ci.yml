name: GodoForge template integrity (Godot 4.7)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  template-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check pristine template and initializer
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Install pinned Godot 4.7.2-stable
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          ./Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Validate the GodoForge host project
        run: python3 scripts/ci/run_tests.py --godot ./Godot_v4.7.2-stable_linux.x86_64
      - name: Generate and validate a real sample plugin
        run: python3 scripts/ci/check_generated.py --godot ./Godot_v4.7.2-stable_linux.x86_64
